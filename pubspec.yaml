name: visdroid
description: "VisDroid — IDE ViScript cho Android, nhúng engine ViScript (.so) chạy tức thì."
publish_to: 'none'

version: 1.2.0+7

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  material_ui: ^1.11.1
  soundpool: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/visdroid-icon.png
    - assets/game/
    - assets/game/sfx/
