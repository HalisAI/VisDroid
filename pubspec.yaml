name: visdroid
description: "VisDroid — IDE ViScript cho Android, nhúng engine ViScript (.so) chạy tức thì."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  ffi: ^2.1.4
  material_ui: ^1.11.1

# path_provider_android 2.3.x đã chuyển sang plugin JNI (kéo theo NDK 28.2 cho bản
# build app) — ghim về 2.2.15 thuần Kotlin, đủ dùng trên Android 7.1.1 và nhẹ hơn.
dependency_overrides:
  path_provider_android: 2.2.15
  shared_preferences_android: 2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
