name: Test bot push qua protection

# Workflow tạm: xác nhận github-actions (GITHUB_TOKEN) push thẳng main được
# qua branch protection "Restrict who can push" (allowlist users: mhieuhonda).
# Chạy bằng nút Run workflow — commit xoá chính nó, push thành công = test OK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xoá chính mình + push qua protection
        run: |
          git config user.name "visdroid-cd"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/test-push-protection.yml
          git commit -m "ci: xác nhận github-actions push thẳng main qua protection — dọn workflow test"
          git push
