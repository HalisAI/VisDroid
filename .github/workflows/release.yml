name: Build APK

# Chạy khi một release được publish (hoặc bấm Run workflow thủ công):
# build APK release và đính kèm vào bản phát hành đó.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # NDK 27: engine đã biên dịch sẵn (jniLibs committed) nên chỉ cần cho
      # AGP strip native libs khi đóng gói.
      - name: Install NDK 27
        run: yes | sdkmanager --install "ndk;27.0.12077973" >/dev/null

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ViScript

      - name: Set up Flutter 3.50 (Dart 3.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Biên dịch lại engine ViScript cho cả 3 ABI (ghim linker NDK vào
      # .cargo/config.toml) rồi chép .so vào jniLibs.
      - name: Build ViScript engine (.so)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash native/build-so.sh all

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          mv build/app/outputs/flutter-apk/app-release.apk "VisDroid-${TAG}.apk"

      # Đính kèm APK vào release vừa tạo (trigger release.published).
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VisDroid-*.apk

      # Khi chạy thủ công (workflow_dispatch): lưu APK làm artifact để tải về.
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VisDroid-APK
          path: VisDroid-*.apk
