name: Build APK

# Chạy khi một release được publish (hoặc bấm Run workflow thủ công):
# build APK release và đính kèm vào bản phát hành đó.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest có sẵn Android SDK ($ANDROID_HOME).
      - name: Set up Flutter 3.50 (Dart 3.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      # Tải engine artifacts cho đúng variant release (libflutter.so ~8MB/ABI);
      # không cache Flutter SDK — cache thiếu artifacts cho ra APK 500MB.
      - name: Precache Android engine
        run: flutter precache --android --no-ios

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Engine libvis_ffi.so đã biên dịch sẵn và committed trong jniLibs (3 ABI).
      # AGP chỉ cần NDK cho bước strip native libs khi đóng gói — dùng stub tối
      # thiểu (source.properties + llvm-strip no-op) thay vì tải 2GB toolchain.
      - name: Prepare NDK 27 stub
        run: bash scripts/make_ndk_stub.sh "$ANDROID_HOME/ndk/27.0.12077973" 27.0.12077973

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          mv build/app/outputs/flutter-apk/app-release.apk "VisDroid-${TAG}.apk"

      # Đính kèm APK vào release vừa tạo (trigger release.published).
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VisDroid-*.apk

      # Khi chạy thủ công (workflow_dispatch): lưu APK làm artifact để tải về.
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VisDroid-APK
          path: VisDroid-*.apk
