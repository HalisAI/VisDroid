name: Build APK

# Chạy khi một release được publish (hoặc bấm Run workflow thủ công):
# build APK release và đính kèm vào bản phát hành đó.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest có sẵn Android SDK ($ANDROID_HOME).
      - name: Set up Flutter 3.50 (Dart 3.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      # Tải sẵn engine artifacts variant release. Không cache Flutter SDK.
      - name: Precache Android engine
        run: flutter precache --android --no-ios

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # NDK 27 thật là BẮT BUỘC: bản libflutter.so release trong cache của
      # Flutter giữ nguyên debug symbols (~170MB/ABI); AGP dùng llvm-strip của
      # NDK để thu về ~10MB khi đóng gói. Dùng đường dẫn đầy đủ tới sdkmanager
      # vì runner không đưa sdkmanager vào PATH.
      - name: Install NDK 27
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK (kèm cầu chì kích thước)
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # libflutter.so chưa strip ⇒ ~520MB; đã strip ⇒ ~75MB.
          if [ "$SIZE" -gt 200000000 ]; then
            echo "::error::APK quá lớn — libflutter.so chưa được strip (NDK thiếu?)"
            unzip -l "$APK" | grep -E 'lib/.*\.so' || true
            exit 1
          fi
          mv "$APK" "VisDroid-${TAG}.apk"

      # Đính kèm APK vào release vừa tạo (trigger release.published).
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VisDroid-*.apk

      # Khi chạy thủ công (workflow_dispatch): lưu APK làm artifact để tải về.
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VisDroid-APK
          path: VisDroid-*.apk
