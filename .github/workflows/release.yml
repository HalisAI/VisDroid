name: Build APK

# Chạy khi một release được publish (hoặc bấm Run workflow thủ công):
# build APK release và đính kèm vào bản phát hành đó.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest có sẵn Android SDK ($ANDROID_HOME).
      - name: Set up Flutter 3.50 (Dart 3.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      # Tải sẵn engine artifacts variant release. Không cache Flutter SDK.
      - name: Precache Android engine
        run: flutter precache --android --no-ios

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # NDK 27 thật là BẮT BUỘC: bản libflutter.so release trong cache của
      # Flutter giữ nguyên debug symbols (~170MB/ABI); AGP dùng llvm-strip của
      # NDK để thu về ~10MB khi đóng gói. Dùng đường dẫn đầy đủ tới sdkmanager
      # vì runner không đưa sdkmanager vào PATH.
      - name: Install NDK 27
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      # Rust + target Android: build lại libvis_ffi.so từ native/ViScript
      # (fork đã đồng bộ upstream) trước khi đóng gói APK.
      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      # Upstream ghim toolchain cố định (rust-toolchain.toml, VD-252: 1.100.0) —
      # target Android phải cài cho ĐÚNG bản được pin, nếu không cargo
      # cross-compile thiếu std `core` của target (E0463).
      - name: Install Android targets cho toolchain được pin
        run: |
          PIN=$(python3 -c "import tomllib; print(tomllib.load(open('native/ViScript/rust-toolchain.toml','rb'))['toolchain']['channel'])")
          echo "Pin toolchain: $PIN"
          rustup toolchain install "$PIN" --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android --toolchain "$PIN"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ViScript/target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('native/ViScript/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Build libvis_ffi.so (3 ABI)
        run: ./native/build-so.sh all

      # -v để log hiển thị tiến độ từng task gradle (sửa xong vấn đề chậm thì bỏ).
      - name: Build APK
        run: flutter build apk --release -v

      - name: Rename APK (kèm cầu chì kích thước)
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # libflutter.so chưa strip ⇒ ~520MB; đã strip ⇒ ~75MB.
          if [ "$SIZE" -gt 200000000 ]; then
            echo "::error::APK quá lớn — libflutter.so chưa được strip (NDK thiếu?)"
            unzip -l "$APK" | grep -E 'lib/.*\.so' || true
            exit 1
          fi
          mv "$APK" "VisDroid-${TAG}.apk"

      # Đính kèm APK vào release vừa tạo (trigger release.published).
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: VisDroid-*.apk

      # Khi chạy thủ công (workflow_dispatch): lưu APK làm artifact để tải về.
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VisDroid-APK
          path: VisDroid-*.apk
